[project]
name = "sangam"
version = "0.14.0"
description = "A small, self-hosted document server for humans and agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Jay Shah" }]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162.4,<1",
  "httpx>=0.28,<1",
  "markdownify>=1.2.3,<2",
  "mcp>=2.3.0,<3",
  "openai-agents>=0.24.0,<1",
  "openai-chatkit>=1.6.5,<2",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.15.1,<3",
  "pypdf>=6.21.4,<7",
  "typer>=0.27.3,<1",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.urls]
Homepage = "https://github.com/jayshah5696/sangam"
Repository = "https://github.com/jayshah5696/sangam"
Issues = "https://github.com/jayshah5696/sangam/issues"

[project.scripts]
sangam = "sangam.cli:app"

[dependency-groups]
dev = [
  "httpx2>=2.16.0,<3",
  "mypy>=2.4.0,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=6.2,<7",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.17.3,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sangam"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/NOTICE.md",
  "/README.md",
  "/pyproject.toml",
  "/src/sangam",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "SIM",
  "BLE001",  # Catch specific exceptions, or preserve the traceback.
  "DTZ",     # Use explicit timezones.
  "G",       # Keep logging arguments separate from the format string.
  "S307",    # No eval.
  "S506",    # No unsafe YAML loading.
  "S602",    # No subprocess shell execution.
  "N",       # PEP 8 naming.
  "A",       # Do not shadow builtins.
  "C4",      # Prefer direct comprehensions and generator expressions.
  "PIE",     # Remove redundant constructs and duplicate definitions.
  "RET",     # Keep return paths explicit and avoid unnecessary nesting.
  "PLC", "PLE", "PLW",  # Pylint convention, correctness, and warning checks.
  "LOG",     # Correct logging API usage.
  "ASYNC",   # Do not block or misuse asynchronous operations.
  "D2", "D3", "D4",    # Check existing docstrings using Google's convention.
  "RUF008", "RUF012",   # No accidental mutable dataclass or class defaults.
  "RUF100",             # Remove obsolete lint suppressions.
  "TRY002", "TRY203", "TRY400", "TRY401",  # Preserve useful exception evidence.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
enable_error_code = ["exhaustive-match", "ignore-without-code", "possibly-undefined", "unused-awaitable"]
