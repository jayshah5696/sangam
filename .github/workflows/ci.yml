name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, UI, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-manager-cache: false
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: "1.40.0"
      - run: uv sync --frozen
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Canonical source, frontend, docs, and release gates
        run: just check
      - name: Backup restore drill
        run: just verify-restore-drill
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-evidence
          path: |
            artifacts/restore-drill/**
            artifacts/verify-sangam/**
          if-no-files-found: ignore
      - name: Desktop and narrow browser gates
        run: |
          just install-browsers
          just test-e2e

  artifacts:
    name: Wheel and sdist clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true
      - run: ./scripts/smoke-package.sh

  container:
    name: Container, Compose, and blocking scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ./scripts/validate-compose.sh
      - run: ./scripts/docker-smoke.sh
      - name: Report all HIGH and CRITICAL container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sangam:smoke
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Block fixable HIGH and CRITICAL container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sangam:smoke
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
