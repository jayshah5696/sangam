name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, UI, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-manager-cache: false
      - run: uv sync --frozen
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Python and frontend gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          pnpm --dir frontend run format:check
          pnpm --dir frontend run build
          pnpm --dir frontend run lint
          pnpm --dir frontend run test
      - name: Desktop and narrow browser gates
        run: |
          pnpm --dir frontend exec playwright install --with-deps chromium
          pnpm --dir frontend run test:e2e
      - name: Documentation gates
        run: |
          uv run python scripts/verify-docs.py
          node frontend/scripts/verify-mermaid.mjs
          pnpm --dir frontend exec markdownlint-cli2 "README.md" "SECURITY.md" "docs/**/*.md"
      - run: uv run python scripts/verify-release-config.py
      - run: uv run python scripts/verify-version.py --frontend-dist
      - run: ./scripts/audit-dependencies.sh

  artifacts:
    name: Wheel and sdist clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true
      - run: ./scripts/smoke-package.sh

  container:
    name: Container, Compose, and blocking scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ./scripts/validate-compose.sh
      - run: ./scripts/docker-smoke.sh
      - name: Report all HIGH and CRITICAL container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sangam:smoke
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Block fixable HIGH and CRITICAL container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sangam:smoke
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
